name: Python Smoke

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - "copilot/**"

jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install --upgrade pip cryptography

      - name: Module import smoke
        run: python -c "import sealed_core, gatekeeper_v2_2, sealed_snapshot; print('imports-ok')"

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Core self-test
        run: python sealed_core.py --self-test
